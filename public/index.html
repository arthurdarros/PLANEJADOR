<style>
:root{--bg:#f2f6f7;--card:#fff;--ink:#12303b;--mute:#5d7580;--line:#d5e0e4;--acc:#0e7c86;--accink:#fff;--price:#b86e00;--del:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c21;--card:#172a31;--ink:#e6f0f2;--mute:#93a9b1;--line:#2a4149;--acc:#3cc0cb;--accink:#06262a;--price:#f0b45a;--del:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1c21;--card:#172a31;--ink:#e6f0f2;--mute:#93a9b1;--line:#2a4149;--acc:#3cc0cb;--accink:#06262a;--price:#f0b45a;--del:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;line-height:1.1}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--acc);color:var(--accink);text-decoration:none;display:inline-block}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.setup{margin-top:8vh}
.setup h1{font-size:clamp(34px,9vw,52px);font-weight:800;margin-bottom:8px}
.setup p{color:var(--mute);margin:0 0 12px}
.err{color:var(--del);min-height:22px;margin:8px 0 0;font-size:14px}
.ticket{background:var(--acc);color:var(--accink);border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.ticket h1{font-size:clamp(28px,7vw,40px);font-weight:800}
.ticket small{display:block;opacity:.85}
.ticket .tot{text-align:right;margin-left:auto}.ticket .tot b{font:800 28px "Bricolage Grotesque",sans-serif}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);white-space:nowrap;padding:8px 14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.searches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.searches .btn{padding:8px 12px;font-size:14px}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:10px}
.item:first-child{border-top:0}
.item .n{font-weight:600}.item .m{color:var(--mute);font-size:14px}
.item .p{color:var(--price);font-weight:600;white-space:nowrap}
.item a{color:var(--acc)}
.x{background:transparent;color:var(--del);padding:2px 8px;font-size:14px}
.empty{color:var(--mute);margin:12px 0 0}
.sum{width:100%;border-collapse:collapse;margin-bottom:16px}.sum td{padding:8px 0;border-top:1px solid var(--line)}.sum td:last-child{text-align:right;color:var(--price);font-weight:600}
.l{display:flex;gap:10px;min-width:0}
.th{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.ok{background:var(--acc);color:var(--accink);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600;vertical-align:middle}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;display:inline-flex;align-items:center;gap:4px}
.day{margin-top:14px}.day h3{font-size:18px;margin-bottom:2px}
</style>
</head>
